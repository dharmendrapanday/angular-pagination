<app-header (tabChanged)="currentTab = $event"></app-header>

<div class="body mt-10px">
  <ng-container [ngSwitch]="currentTab">
    <app-tab-content-first *ngSwitchCase="1"></app-tab-content-first>
    <app-tab-content-second *ngSwitchCase="0"></app-tab-content-second>
    <app-tab-content-third *ngSwitchCase="2"></app-tab-content-third>
    <app-student-section *ngSwitchCase="3"></app-student-section>
  </ng-container>
</div>

<app-footer></app-footer>
